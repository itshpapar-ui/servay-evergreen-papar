<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSRS — Production Sheet Record System</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0F5F0;--card:#FCFEFC;--ink:#12261A;--mut:#5F7566;--line:#D6E2D8;--ac:#2A7A4B;--acfg:#fff;--head:#1F5A3A;--side:#10301F;--okb:#DDF0E2;--ok:#256B40;--rdb:#FBE4E4;--rd:#A33344;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1710;--card:#14241A;--ink:#E6F2E9;--mut:#9DB5A4;--line:#27402F;--ac:#7FD3A0;--acfg:#0C1710;--okb:#1D3A28;--ok:#8FD3A2;--rdb:#47202A;--rd:#F2A0AC}}
:root[data-theme="dark"]{--bg:#0C1710;--card:#14241A;--ink:#E6F2E9;--mut:#9DB5A4;--line:#27402F;--ac:#7FD3A0;--acfg:#0C1710;--okb:#1D3A28;--ok:#8FD3A2;--rdb:#47202A;--rd:#F2A0AC}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Segoe UI",system-ui,sans-serif;line-height:1.5}
.app{display:flex;min-height:100vh}
aside{width:210px;background:var(--side);color:#DDF0E2;padding:18px 12px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px;margin:0 6px 20px;font-weight:800}
.brand i{font-style:normal;background:#1E5236;border:1px solid #3F8A5F;border-radius:10px;padding:6px 8px;font-size:.85rem}
.brand small{display:block;font-weight:600;font-size:.62rem;letter-spacing:.12em;opacity:.7}
nav a{display:block;color:inherit;text-decoration:none;padding:10px 12px;border-radius:10px;margin-bottom:4px;font-weight:600;font-size:.92rem}
nav a.on{background:#2E7A4E;color:#fff}nav a:hover{background:#1A4A2F}
.col{flex:1;min-width:0;padding:16px}
.top{background:var(--head);color:#fff;border-radius:12px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:1.35rem;font-weight:800}.top p{margin:2px 0 0;font-size:.68rem;letter-spacing:.1em;opacity:.85}
.pill-o{border:1px solid #fff9;border-radius:999px;padding:6px 14px;font-size:.78rem;font-weight:800;background:none;color:#fff;cursor:pointer;font-family:inherit}
main{max-width:1000px;margin:16px auto 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.hero h2{font-size:2rem;margin:4px 0;font-weight:800;letter-spacing:-.02em}.hero .k{color:var(--ac);font-weight:800;font-size:.72rem;letter-spacing:.1em}
.mut{color:var(--mut)}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{border-radius:16px;padding:20px;border:1px solid var(--line);background:var(--okb)}.stat b.n{display:block;font-size:2.4rem;line-height:1.2;margin:6px 0}
.tag{font-size:.68rem;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:6px;text-transform:uppercase;background:var(--okb);color:var(--ok)}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.78rem;color:var(--mut)}
ul.act{list-style:none;margin:0;padding:0}ul.act li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}ul.act small{width:100%;color:var(--mut)}
h3{margin:0 0 12px;font-size:1.1rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 8px 14px 0;background:var(--card)}
.seg button{border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--mut);cursor:pointer}.seg button.on{background:var(--ac);color:var(--acfg)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end}
label{display:block;font-size:.78rem;font-weight:700;color:var(--mut)}
input,select{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:disabled{opacity:.6}
.btn{border:0;background:var(--ac);color:var(--acfg);padding:10px 18px;border-radius:10px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:none;border:1px solid var(--line);color:var(--ink)}.btn.r{background:var(--rdb);color:var(--rd)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
.ft{min-width:680px}.ft td input{margin:0;padding:8px}.ft td:first-child{width:36px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:12px}.row label{flex:1 1 180px}
.empty{text-align:center;color:var(--mut);padding:24px}.hint{min-height:1.4em;font-size:.85rem;color:var(--mut);margin:8px 0 0}
.tt b{font-size:1.5rem}
#cpv{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));max-width:min(560px,calc(100vw - 32px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;z-index:25;box-shadow:0 6px 24px #0003;display:none}#cpv.on{display:block}#cpv pre{margin:6px 0 0;font-size:12px;overflow:auto;max-height:180px;white-space:pre}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}#modal.on{display:flex}#modal .card{max-width:440px;width:100%;margin:0}
.pp{background:#fff;color:#111;font-family:Georgia,"Times New Roman",serif;font-size:11px;padding:16px;max-width:760px;margin:0 auto}
.pp h2{text-align:center;margin:0;font-size:14px}.pp .ps{text-align:center;font-weight:700;margin:2px 0 10px}
.pp table{width:100%;border-collapse:collapse;border:1px solid #111}.pp th,.pp td{border:1px solid #111;padding:4px 6px;font-size:10px;text-align:left;height:19px;color:#111}
.pp .pg2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}.pp .pg2 p{margin:6px 0 0;font-size:10px}.pp .pg2 i{display:block;border-top:1px solid #111;height:16px}
#pdoc{display:none}@page{size:A4;margin:8mm}
@media print{body>*:not(#pdoc){display:none!important}body{background:#fff!important}:root{padding:0!important}#pdoc{display:block}}
@media (max-width:760px){.app{flex-direction:column}aside{width:100%;padding:10px}.brand{margin-bottom:8px}nav{display:flex;overflow-x:auto;gap:4px}nav a{white-space:nowrap;margin:0}.hero h2{font-size:1.5rem}}
</style>
</head>
<body>
<div class="app">
<aside><div class="brand"><i>PS</i><div>PSRS<small>PRODUCTION SHEET RECORDS</small></div></div><nav id="nav"></nav></aside>
<div class="col">
<header class="top"><div><h1>PSRS — Production Sheet Record System</h1><p>MATERIAL TRANSFORMATION · PRODUCTION SHEET RECORDS · DOCUMENT TRACKING</p></div><button class="pill-o" id="op" data-a="outlet"></button></header>
<main id="main"></main>
</div></div>
<div id="modal"><div class="card"><h3>Outlet name</h3><p class="mut">Printed on every sheet after SERVAY EVERGREEN SDN BHD. Asked once per device.</p><label>Outlet<input id="ob" placeholder="e.g. PAPAR (SEGSHPP)"></label><div class="row"><button class="btn" data-a="osave" data-v="ob">Continue</button></div></div></div>
<div id="pdoc" aria-hidden="true"></div>
<div id="cpv" role="status"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const CATS=["Fruit","Vegetable"];
const AYD=["WHOLE CHICKEN","LEG QUARTER","FRONT QUARTER","CHICKEN WINGS","CHICKEN NECK","CHICKEN TAIL","CHICKEN DRUMSTICK","CHICKEN THIGH","CHICKEN ASSORTED","CHICKEN LIVER","CHICKEN GIZZARD","CHICKEN FEET","CHICKEN BONE"];
const ayc=()=>{let c=null;try{c=JSON.parse(localStorage.getItem("ps-ayam"))}catch(e){}
  if(Array.isArray(c))return Array.from({length:Math.max(AYD.length,c.length)},(_,i)=>({desc:(c[i]||{}).desc||AYD[i]||"",mat:(c[i]||{}).mat||"",tc:(c[i]||{}).tc||"",qty:0,unit:"KG"}));
  c=c||{};return AYD.map(d=>({desc:d,mat:(c[d]||{}).mat||"",tc:(c[d]||{}).tc||"",qty:0,unit:"KG"}))};
const NAV=[["home","⌂  Home"],["new","＋  New Sheet"],["sheets","▤  Production Sheet Records"],["master","☰  Masterlist"],["ayam","🐔  Ayam Codes"],["store","⚙  Store"]];
const L=(()=>{
  const K="ps-local-v1";let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
  const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},ls={},fire=c=>(ls[c]||[]).forEach(f=>f());
  const ref=(c,id)=>({set:async d=>{(S[c]=S[c]||{})[id]=JSON.parse(JSON.stringify(d));sv();fire(c)},update:async d=>{const o=(S[c]||{})[id];if(!o)return;S[c][id]=JSON.parse(JSON.stringify({...o,...d}));sv();fire(c)},delete:async()=>{if(S[c])delete S[c][id];sv();fire(c)}});
  return{collection:c=>({doc:id=>ref(c,id),onSnapshot:f=>{const g=()=>f(Object.entries(S[c]||{}).map(([id,d])=>({...d,id})));(ls[c]=ls[c]||[]).push(g);g()}})}
})();
let OUT="";try{OUT=localStorage.getItem("ps-outlet")||""}catch(e){}
let SH=[],M={},view="home",sub="pending",sq="",mq="",ML=null,sv=null,se=false,nk="ayam",sk="";
const $=s=>document.querySelector(s),v=id=>($("#"+id)||{}).value||"";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtD=d=>d?d.slice(8,10)+"."+d.slice(5,7)+"."+d.slice(0,4):"";
const parseD=s=>{const m=String(s).trim().match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);if(!m)return"";const d=+m[1],o=+m[2];if(d<1||d>31||o<1||o>12)return"";return m[3]+"-"+String(o).padStart(2,"0")+"-"+String(d).padStart(2,"0")};
const mine=()=>SH.filter(s=>s.outlet===OUT);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2400)}
const fld=(id,l,val="",ph="",type="text")=>`<label>${l}<input id="${id}" type="${type}" value="${esc(val)}" placeholder="${ph}" autocomplete="off"></label>`;
const sel=(id,l,opts,val="")=>`<label>${l}<select id="${id}"><option value="">Select…</option>${opts.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
const seg=(items,cur,a)=>`<div class="seg">${items.map(([k,l])=>`<button class="${cur===k?"on":""}" data-a="${a}" data-v="${k}">${l}</button>`).join("")}</div>`;
const mkey=c=>"m_"+String(c).trim().replace(/[^A-Za-z0-9_-]/g,"_").slice(0,150);
const find=(val,k)=>Object.values(M).find(x=>x[k]===val);
const sum=r=>+r.reduce((a,x)=>a+(+x.qty||0),0).toFixed(3);
const N=s=>s.src?s:{...s,src:(s.rows||[]).map(r=>({...r,unit:"KG"})),tgt:[],plant:s.plant||"",sloc:s.sloc||"",header:s.header||"",post:s.post||s.date};
const arows=s=>s.ar||[...(s.src||[]).map(r=>({...r,qi:0,qo:r.qty})),...(s.tgt||[]).map(r=>({...r,qi:r.qty,qo:0}))];
const paperRows=s=>{const a=s.kind==="ayam"?arows(s).map(r=>({...r,i:r.qi,o:r.qo})):[...s.src.map(r=>({...r,o:r.qty})),...s.tgt.map(r=>({...r,i:r.qty}))];while(a.length<13)a.push({});return a};
const lastP=()=>{try{return JSON.parse(localStorage.getItem("ps-last"))||{}}catch(e){return{}}};
const rowH=(n,r={})=>`<tr><td>${n}</td><td><input class="rt" value="${esc(r.tc)}" aria-label="Barcode ${n}"></td><td><input class="rm" value="${esc(r.mat)}" aria-label="Material ${n}"></td><td><input class="rd" value="${esc(r.desc)}" aria-label="Description ${n}"></td><td><input class="rb" value="${esc(r.batch)}" aria-label="Batch ${n}"></td><td><input class="rq" type="number" step="any" value="${r.qty||""}" aria-label="Quantity ${n}"></td><td><input class="ru" value="${esc(r.unit||"KG")}" aria-label="Unit ${n}" style="width:64px"></td><td><button class="btn g" data-a="clr" aria-label="Clear row ${n}">Clear</button></td></tr>`;
const gridH=(id,rows)=>`<div class="tbl"><table class="ft"><thead><tr><th>No</th><th>Barcode</th><th>Material</th><th>Material description</th><th>Batch</th><th>Quantity</th><th>Unit</th><th></th></tr></thead><tbody id="${id}">${rows.map((r,i)=>rowH(i+1,r)).join("")}</tbody></table></div>`;
const ayRow=(r,i)=>`<tr><td>${i+1}</td><td><input class="rm" value="${esc(r.mat)}" aria-label="Material ${i+1}"></td><td><input class="rt" value="${esc(r.tc)}" aria-label="Barcode ${i+1}"></td><td><input class="rd" value="${esc(r.desc)}" aria-label="Description ${i+1}"></td><td><input class="rq ai" type="number" step="any" value="${r.qi||""}" aria-label="Qty in ${i+1}"></td><td><input class="rq ao" type="number" step="any" value="${r.qo||""}" aria-label="Qty out ${i+1}"></td><td><button class="btn g" data-a="clr" aria-label="Clear row ${i+1}">Clear</button></td></tr>`;
function ayH(s){
  const rows=s?arows(s):ayc();
  return `<div class="tbl"><table class="ft"><thead><tr><th>No</th><th>Material</th><th>Barcode</th><th>Description</th><th>Qty in (kg)</th><th>Qty out (kg)</th><th></th></tr></thead><tbody id="ab">${rows.map((r,i)=>ayRow(r,i)).join("")}</tbody></table></div><div class="row"><button class="btn g" data-a="addrow" data-v="a">+ Add item row</button></div>`;
}
function formH(s0,ed){
  const s=s0?N(s0):{},k=s.kind||nk,lp=lastP();let o,i,body;
  const fc=(g,l,f)=>`<button class="btn g" data-a="fcpy" data-k="${g}" data-f="${f}">${l}</button>`,fh=(l,id)=>`<button class="btn g" data-a="fch" data-i="${id}">${l}</button>`,
  fp=`<section class="card"><h3>📋 Copy to SAP (before saving)</h3><p class="mut">Copies what is on this form right now, so you do not need to save first. Only rows with a quantity are copied.</p><div class="row" style="margin-top:4px"><b style="flex:0 0 130px">Source (left grid)</b>${fc("src","Material + Qty","all")}${fc("src","Material only","mat")}${fc("src","Quantity only","qty")}</div><div class="row"><b style="flex:0 0 130px">Target (right grid)</b>${fc("tgt","Material + Qty","all")}${fc("tgt","Material only","mat")}${fc("tgt","Quantity only","qty")}</div><div class="row"><b style="flex:0 0 130px">Header fields</b>${fh("Plant","f-pl")}${fh("Storage location","f-sl")}${fh("Document date","f-dt")}${fh("Posting date","f-pd")}${fh("Header text","f-ht")}</div></section>`;
  if(k==="ayam"){
    const rows=s0?arows(s):ayc();o=s0?sum(s.src):0;i=s0?sum(s.tgt):0;
    body=`<section class="card"><h3>🐔 Ayam — whole chicken out, chicken parts in</h3>${!s0&&rows.some(r=>!r.mat||!r.tc)?`<p class="hint" style="color:var(--rd)">Some material or barcode codes are not set yet. <a href="#ayam">Set them in Ayam Codes</a>, or type them below — they are remembered for next time.</p>`:""}${ayH(s0?s:null)}<p class="hint">Enter the quantities. Qty in and Qty out are open on every line, so any part can go either way. Material, barcode and description can be changed at any time — what you save here is remembered for the next sheet.</p></section>`;
  }else{
    const src=[...(s.src||[])],tgt=[...(s.tgt||[])];while(src.length<1)src.push({});while(tgt.length<12)tgt.push({});o=sum(src);i=sum(tgt);
    body=`<section class="card"><h3>Source — material going out (Qty out)</h3>${gridH("sb",src)}<div class="row"><button class="btn g" data-a="addrow" data-v="s">+ Add source row</button></div></section>
  <section class="card"><h3>Target — material coming in (Qty in)</h3>${gridH("tb",tgt)}<div class="row"><button class="btn g" data-a="addrow" data-v="t">+ Add target row</button></div><p class="hint" id="hint">Type or scan a barcode or material — the description fills in from the masterlist.</p></section>`;
  }
  return `<section class="card"><h3>${ed?"✎ Editing "+s.ref:"＋ Create Material Transformation"} <span class="pill">${k==="ayam"?"Ayam":"Fruit & Vege"}</span></h3><div class="form"><label>Transformation document<input value="${esc(s.trans)}" placeholder="Assigned after posting" disabled></label>${fld("f-pl","Plant",s.plant||lp.plant||"")}${fld("f-sl","Storage location",s.sloc||lp.sloc||"")}${fld("f-dt","Document date (DD.MM.YYYY)",fmtD(s.date||today()),"DD.MM.YYYY")}${fld("f-pd","Posting date (DD.MM.YYYY)",fmtD(s.post||s.date||today()),"DD.MM.YYYY")}${k==="ayam"?"":sel("f-ct","Category",[...new Set([...CATS,...(s.cat?[s.cat]:[])])],s.cat)}${fld("f-ht","Mat. trans. doc. header text",s.header)}</div></section>
  ${body}${fp}
  <section class="card"><div class="grid tt"><div><span class="mut">Total qty out (source)</span><br><b id="tout">${o}</b> kg</div><div><span class="mut">Total qty in (target)</span><br><b id="tin">${i}</b> kg</div><div><span class="mut">Difference weight</span><br><b id="tdif">${+(o-i).toFixed(3)}</b> kg</div></div></section>
  <section class="card"><h3>Sign-off</h3><div class="form">${fld("f-pr","Prepared by (name)",s.prep)}${fld("f-ck","Check by (name)",s.chk)}${fld("f-vf","Verify by (name)",s.ver)}${fld("f-ky","Key in by (name)",s.keyin)}</div>${ed?`<div class="form" style="margin-top:12px">${fld("f-tr","Transformation doc.",s.trans)}${fld("f-gi","Goods issue slip no.",s.gi)}</div>`:""}</section>
  <div class="row" style="margin:0 0 16px"><button class="btn" data-a="${ed?"supd":"sadd"}">${ed?"Save changes":"Save sheet"}</button>${ed?`<button class="btn g" data-a="scancel">Cancel</button>`:""}</div>`;
}
function collect(){
  const date=parseD(v("f-dt")),base={plant:v("f-pl").trim(),sloc:v("f-sl").trim(),header:v("f-ht").trim(),date,post:parseD(v("f-pd"))||date,badpost:!!v("f-pd").trim()&&!parseD(v("f-pd")),prep:v("f-pr").trim(),chk:v("f-ck").trim(),ver:v("f-vf").trim(),keyin:v("f-ky").trim()};
  if($("#ab")){const rs=[...document.querySelectorAll("#ab tr")].map(tr=>({mat:tr.querySelector(".rm").value.trim(),tc:tr.querySelector(".rt").value.trim(),desc:tr.querySelector(".rd").value.trim(),batch:"",unit:"KG",qi:+tr.querySelector(".ai").value||0,qo:+tr.querySelector(".ao").value||0})).filter((r,i)=>i<AYD.length||r.mat||r.tc||r.desc||r.qi||r.qo);return{...base,kind:"ayam",cat:"Ayam",ar:rs,src:rs.filter(r=>r.qo>0).map(r=>({...r,qty:r.qo})),tgt:rs.filter(r=>r.qi>0).map(r=>({...r,qty:r.qi}))}}
  const g=q=>[...document.querySelectorAll(q+" tr")].map(tr=>({tc:tr.querySelector(".rt").value.trim(),mat:tr.querySelector(".rm").value.trim(),desc:tr.querySelector(".rd").value.trim(),batch:tr.querySelector(".rb").value.trim(),qty:+tr.querySelector(".rq").value||0,unit:(tr.querySelector(".ru").value.trim()||"KG").toUpperCase()})).filter(r=>r.tc||r.mat||r.desc||r.qty);
  return{...base,kind:"fv",cat:v("f-ct"),src:g("#sb"),tgt:g("#tb")};
}
function check(d){
  if(!d.date||!d.cat||!d.prep)return"Enter a valid document date (DD.MM.YYYY), category and prepared by";if(d.badpost)return"Posting date must be DD.MM.YYYY";
  const all=[...d.src,...d.tgt];if(d.kind==="ayam")return all.some(r=>r.qty>0)?"":"Enter at least one quantity";
  if(!all.length)return"Add at least one material row";
  if(all.some(r=>!(r.tc||r.mat||r.desc)||!(r.qty>0)))return"Each row needs a barcode, material or description, and a quantity";return""
}
const cnt=s=>N(s).src.length+N(s).tgt.length,tout=s=>sum(N(s).src),tin=s=>sum(N(s).tgt);
function home(){
  const m=mine(),rec=[...m].sort((a,b)=>b.created-a.created).slice(0,5),td=+m.filter(s=>s.date===today()).reduce((a,s)=>a+tout(s),0).toFixed(3);
  return `<section class="card hero"><span class="k">PSRS · PRODUCTION SHEET RECORD SYSTEM</span><h2>Welcome back.</h2><p class="mut">${new Date().toLocaleDateString("en-GB",{weekday:"long"})+", "+fmtD(today())} — record material transformation and track each sheet.</p><p class="mut" style="font-size:.85rem">ⓘ Data is saved only in this browser on this device.</p></section>
  <div class="grid"><div class="stat"><b>Pending sheets</b><b class="n">${m.filter(s=>s.status==="pending").length}</b><span class="mut">Waiting for IT processing</span></div><div class="stat"><b>Completed sheets</b><b class="n">${m.filter(s=>s.status==="done").length}</b><span class="mut">With transformation doc.</span></div><div class="stat"><b>Today’s qty out</b><b class="n">${td} kg</b><span class="mut">All sheets dated today</span></div></div>
  <div class="grid" style="margin-top:16px"><div class="card"><h3>New Production Sheet</h3><p class="mut">Fill in the transformation like the SAP screen, print the sheet, and send it for processing.</p><a class="btn" href="#new">Start new sheet →</a></div><div class="card"><h3>◷ Recent Activity</h3><ul class="act">${rec.length?rec.map(s=>`<li><span class="tag">${esc(s.cat)}</span><b>${s.ref}</b><span class="pill">${cnt(s)} row(s) · out ${tout(s)} kg</span><small>${fmtD(s.date)} · ${esc(s.prep)}</small></li>`).join(""):`<li class="mut">No sheets yet.</li>`}</ul></div></div>`;
}
const newv=()=>seg([["ayam","🐔 Ayam"],["fv","🍎 Fruit & Vege"]],nk,"nk")+formH(null,false);
function sheets(){
  if(sv){const s=SH.find(x=>x.id==sv);if(s)return se?formH(s,true):view1(s);sv=null}
  const m=mine(),q=sq.trim().toLowerCase(),list=m.filter(s=>(sub==="all"||s.status===sub)&&(!sk||(s.kind||"fv")===sk)&&(!q||(s.ref+" "+(s.trans||"")+" "+(s.gi||"")+" "+s.cat+" "+(s.header||"")).toLowerCase().includes(q))).sort((a,b)=>b.created-a.created);
  return seg([["pending","● Pending · "+m.filter(s=>s.status==="pending").length],["done","✓ Completed"],["all","All"]],sub,"sub")+seg([["","All types"],["ayam","Ayam"],["fv","Fruit & Vege"]],sk,"sk")+`<section class="card"><h3>Production sheet records (${list.length})</h3><div class="row" style="margin:0 0 12px">${fld("sq","Search reference, category or transformation doc.",sq)}<button class="btn" data-a="ssearch">Search</button></div>${list.length?`<div class="tbl"><table><tr><th>Reference</th><th>Date</th><th>Category</th><th>Rows</th><th>Out (kg)</th><th>In (kg)</th><th>Status</th><th>Transformation doc.</th><th></th></tr>${list.map(s=>`<tr data-a="sv" data-v="${s.id}" style="cursor:pointer"><td><button class="btn g" data-a="sv" data-v="${s.id}">${s.ref}</button></td><td>${fmtD(s.date)}</td><td>${esc(s.cat)}</td><td>${cnt(s)}</td><td>${tout(s)}</td><td>${tin(s)}</td><td>${s.status==="done"?`<span class="tag">Completed</span>`:`<span class="pill">Pending</span>`}</td><td>${esc(s.trans||"—")}</td><td><button class="btn r" data-a="sdel" data-v="${s.id}">Delete</button></td></tr>`).join("")}</table></div><p class="mut">Click a sheet to view it.</p>`:`<p class="empty">No sheets here yet.</p>`}</section>`;
}
function paperH(s0){
  const s=N(s0),all=paperRows(s);
  const o=sum(s.src),i=sum(s.tgt);
  return `<div class="pp"><h2>SERVAY EVERGREEN SDN BHD - ${esc(OUT)}</h2><p class="ps">MATERIAL TRANSFORMATION (PRODUCTION SHEET) - ${esc((s.cat||"").toUpperCase())}</p><p>DATE : <b>${fmtD(s.date)}</b> &nbsp;&nbsp; REF : <b>${s.ref}</b></p>
  <table><tr><th>NO</th><th>MATERIAL</th><th>BARCODE</th><th>DESCRIPTION</th><th>QTY IN (KG)</th><th>QTY OUT (KG)</th></tr>${all.map((r,k)=>`<tr><td>${k+1}</td><td>${esc(r.mat)}</td><td>${esc(r.tc)}</td><td>${esc(r.desc)}</td><td>${r.i||""}</td><td>${r.o||""}</td></tr>`).join("")}<tr><td colspan="4" style="text-align:right"><b>TOTAL WEIGHT</b></td><td><b>${i||""}</b></td><td><b>${o||""}</b></td></tr><tr><td colspan="4" style="text-align:right"><b>DIFFERENCE WEIGHT</b></td><td colspan="2"><b>${+(o-i).toFixed(3)}</b></td></tr></table>
  <div class="pg2"><div><p>PREPARED BY :</p><i></i><p>NAME : <b>${esc(s.prep)}</b></p><p>CHECK BY :</p><i></i><p>NAME : <b>${esc(s.chk)}</b></p><p>VERIFY BY :</p><i></i><p>NAME : <b>${esc(s.ver)}</b></p></div><div><p>TRANSFORMATION DOC. : <b>${esc(s.trans)}</b></p><i></i><p>GOODS ISSUE SLIP NO : <b>${esc(s.gi)}</b></p><i></i><p>KEY IN BY :</p><i></i><p>NAME : <b>${esc(s.keyin)}</b></p></div></div></div>`;
}
function view1(s0){
  const s=N(s0),cp=(k,l,f)=>`<button class="btn g" data-a="cpy" data-v="${s.id}" data-k="${k}" data-f="${f}">${l}</button>`,hc=(l,x)=>`<button class="btn g" data-a="cph" data-t="${esc(x)}" ${x?"":"disabled"}>${l}</button>`,
  pn=`<section class="card"><h3>📋 Copy to SAP</h3><p class="mut">Click a button, then paste (Ctrl+V) into the matching SAP field or column. Only rows with a quantity are copied.</p><div class="row" style="margin-top:4px"><b style="flex:0 0 130px">Source (left grid)</b>${cp("src","Material + Qty","all")}${cp("src","Material only","mat")}${cp("src","Quantity only","qty")}</div><div class="row"><b style="flex:0 0 130px">Target (right grid)</b>${cp("tgt","Material + Qty","all")}${cp("tgt","Material only","mat")}${cp("tgt","Quantity only","qty")}</div><div class="row"><b style="flex:0 0 130px">Header fields</b>${hc("Plant",s.plant)}${hc("Storage location",s.sloc)}${hc("Document date",fmtD(s.date))}${hc("Posting date",fmtD(s.post))}${hc("Header text",s.header)}</div></section>`,m=(k,x)=>`<div><span class="mut" style="font-size:.75rem;font-weight:700;text-transform:uppercase">${k}</span><br><b>${esc(x||"—")}</b></div>`;
  return `<div class="row" style="margin:0 0 12px"><button class="btn g" data-a="svback">← All sheets</button><button class="btn" data-a="sedit">✎ Edit</button><button class="btn g" data-a="prn" data-v="${s.id}">🖨 Print</button><button class="btn g" data-a="dpdf" data-v="${s.id}">⬇ PDF</button><button class="btn r" data-a="sdel" data-v="${s.id}">🗑 Delete</button></div>
  <section class="card"><div class="form" style="align-items:start">${m("Plant",s.plant)}${m("Storage location",s.sloc)}${m("Document date",fmtD(s.date))}${m("Posting date",fmtD(s.post))}${m("Header text",s.header)}</div></section>
  ${pn}<section class="card">${paperH(s)}</section>${s.status==="pending"?`<section class="card"><h3>Processing (IT)</h3><div class="form">${fld("c-tr","Transformation doc.")}${fld("c-gi","Goods issue slip no.")}${fld("c-ky","Key in by (name)",s.keyin)}<button class="btn" data-a="sdone" data-v="${s.id}">Mark completed</button></div></section>`:""}`;
}
function master(){
  const q=mq.trim().toLowerCase(),all=Object.values(M),rows=all.filter(x=>!q||(x.mat+" "+x.tc+" "+x.desc).toLowerCase().includes(q)).sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,30),f=ML||{};
  return `<section class="card"><h3>+ Add / Update Masterlist Item</h3><div class="form">${fld("mt","Barcode",f.tc)}${fld("mm","Material",f.mat)}${fld("md","Description",f.desc)}<button class="btn" data-a="msave">Save item</button></div></section>
  <section class="card"><h3>☰ Masterlist (${all.length})</h3><div class="row" style="margin:0 0 12px">${fld("mq","Search barcode, material or description",mq)}<button class="btn" data-a="msearch">Search</button></div>${rows.length?`<div class="tbl"><table><tr><th>Barcode</th><th>Material</th><th>Description</th><th></th></tr>${rows.map(x=>`<tr><td>${esc(x.tc)}</td><td>${x.mat?esc(x.mat):`<span class="tag" style="background:var(--rdb);color:var(--rd)">missing</span>`}</td><td>${esc(x.desc)}</td><td><button class="btn g" data-a="medit" data-v="${x.id}">Edit</button> <button class="btn r" data-a="mdel" data-v="${x.id}">Delete</button></td></tr>`).join("")}</table></div>`:`<p class="empty">${all.length?"No items match.":"Masterlist is empty. Add your first item above."}</p>`}</section>`;
}
const ayamP=()=>{const c=ayc();return `<section class="card"><h3>🐔 Ayam codes</h3><p class="mut">Set the material and barcode for each ayam line once. Staff then only enter quantities. Saved on this device.</p><div class="tbl"><table class="ft"><thead><tr><th>No</th><th>Description</th><th>Material</th><th>Barcode</th></tr></thead><tbody>${c.map((r,i)=>`<tr><td>${i+1}</td><td><input id="yd${i}" value="${esc(r.desc)}" aria-label="Description ${i+1}">${i?"":` <span class="pill">source</span>`}</td><td><input id="ym${i}" value="${esc(r.mat)}" aria-label="Material for ${esc(r.desc)}"></td><td><input id="yt${i}" value="${esc(r.tc)}" aria-label="Barcode for ${esc(r.desc)}"></td></tr>`).join("")}</tbody></table></div><div class="row"><button class="btn" data-a="aysave">Save codes</button></div></section>`};
const store=()=>`<section class="card"><h3>🏢 Outlet</h3><div class="row" style="margin:0"><label>Outlet name<input id="os" value="${esc(OUT)}" placeholder="e.g. PAPAR (SEGSHPP)"></label><button class="btn" data-a="osave" data-v="os">Save outlet</button></div><p class="mut">Printed on every sheet. Sheets are saved per outlet name, so keep it the same on every sheet.</p></section>`;
const V={home,new:newv,sheets,master,ayam:ayamP,store};
function render(){
  $("#nav").innerHTML=NAV.map(([k,l])=>`<a href="#${k}" class="${k===view?"on":""}">${l}</a>`).join("");
  $("#op").textContent="● "+(OUT||"outlet not set");$("#modal").classList.toggle("on",!OUT);
  $("#main").innerHTML=V[view]();
}
function route(){const h=location.hash.slice(1);view=V[h]?h:"home";if(view!=="sheets"){sv=null;se=false}render()}
addEventListener("hashchange",route);
const soft=()=>{if(view==="new"||(view==="sheets"&&sv&&se))return;const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&$("#main").contains(a))return;render()};
function tot(){const f=q=>+[...document.querySelectorAll(q)].reduce((a,x)=>a+(+x.value||0),0).toFixed(3),ay=!!$("#ab"),o=ay?f("#ab .ao"):f("#sb .rq"),i=ay?f("#ab .ai"):f("#tb .rq");[["tout",o],["tin",i],["tdif",+(o-i).toFixed(3)]].forEach(([k,x])=>{const e=$("#"+k);if(e)e.textContent=x})}
function look(t){
  const tr=t.closest("tr"),val=t.value.trim(),m=val&&find(val,t.classList.contains("rm")?"mat":"tc");
  if(m){if(m.mat)tr.querySelector(".rm").value=m.mat;if(m.tc)tr.querySelector(".rt").value=m.tc;if(m.desc)tr.querySelector(".rd").value=m.desc}
  const h=$("#hint");if(h)h.textContent=val?(m?"✓ "+m.desc+(tr.querySelector(".rm").value.trim()?"":" — Material code is empty, please type it"):"Not in masterlist — type the description and add it in Masterlist later"):""
}
document.addEventListener("input",e=>{if(e.target.classList.contains("rq"))tot()});
document.addEventListener("change",e=>{const c=e.target.classList;if(e.target.closest("#ab"))return;if(c.contains("rm")||c.contains("rt"))look(e.target)});
document.addEventListener("keydown",e=>{const c=e.target.classList;if(e.key==="Enter"&&c&&(c.contains("rm")||c.contains("rt"))){e.preventDefault();look(e.target);e.target.closest("tr").querySelector(".rq").focus()}});
async function saveFile(name,data){try{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast("Saved "+name)}catch(e){toast("Could not save file")}}
async function learn(rows){
  for(const r of rows){const t=(r.tc||"").trim(),m=(r.mat||"").trim();if(!(t||m)||!r.desc)continue;const ex=(t&&find(t,"tc"))||(m&&find(m,"mat"))||null;
    await db.collection("masterlist").doc(ex?ex.id:mkey(t||m)).set({mat:m||(ex&&ex.mat)||"",tc:t||(ex&&ex.tc)||"",desc:r.desc,updated:Date.now()})}
}
async function copyText(t,msg){
  const ok=()=>{toast(msg);const p=$("#cpv");if(p){const ln=t.split("\n");p.innerHTML=`<b>Last copied</b> <span class="mut">(▸ = tab)</span> <button class="btn g" data-a="cpvx" style="padding:2px 10px;float:right" aria-label="Close preview">✕</button><pre>${esc(ln.slice(0,12).join("\n").replace(/\t/g," ▸ "))}${ln.length>12?"\n…":""}</pre>`;p.classList.add("on")}};
  try{await navigator.clipboard.writeText(t);ok()}catch(x){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();let c=false;try{c=document.execCommand("copy")}catch(y){}a.remove();c?ok():toast("Copy was blocked by the browser")}
}
function cpy(id,k,f,rows){
  const s=rows?null:SH.find(x=>x.id==id);if(!rows&&!s)return;const r=(rows||N(s)[k]).filter(x=>x.qty>0);if(!r.length)return toast("No rows with a quantity to copy");
  if(f!=="qty"){const bad=r.filter(x=>!x.mat).map(x=>x.desc||x.tc||"?");if(bad.length)return toast("No Material code for: "+bad.slice(0,3).join(", ")+(bad.length>3?" +"+(bad.length-3)+" more":"")+" — fill in Material, then copy again")}
  const m=x=>x.mat||"",col={all:x=>[m(x),x.qty].join("\t"),mat:m,qty:x=>x.qty}[f||"all"];
  return copyText(r.map(col).join("\n"),"Copied "+r.length+" "+(k==="src"?"source":"target")+" "+(f==="mat"?"materials":f==="qty"?"quantities":"rows")+" — paste into SAP");
}
function prn(id){
  const s=SH.find(x=>x.id==id);if(!s)return;$("#pdoc").innerHTML=paperH(s);
  let fired=false;const on=()=>{fired=true};addEventListener("beforeprint",on,{once:true});
  try{window.print()}catch(x){}
  setTimeout(()=>{removeEventListener("beforeprint",on);if(!fired){toast("Direct printing is blocked here — saving the PDF instead. Open it and press Ctrl+P");dpdf(id)}},700);
}
function dpdf(id){
  const s0=SH.find(x=>x.id==id),J=window.jspdf;if(!s0)return;if(!J)return toast("PDF tool did not load — refresh and try again");
  const s=N(s0),doc=new J.jsPDF({unit:"mm",format:"a4"});if(!doc.autoTable)return toast("PDF table tool did not load — refresh and try again");
  const W=210,all=paperRows(s);const o=sum(s.src),i=sum(s.tgt);
  doc.setFont("times","bold");doc.setFontSize(12);doc.text("SERVAY EVERGREEN SDN BHD - "+OUT,W/2,14,{align:"center"});doc.setFontSize(10);doc.text("MATERIAL TRANSFORMATION (PRODUCTION SHEET) - "+(s.cat||"").toUpperCase(),W/2,20,{align:"center"});doc.setFont("times","normal");doc.setFontSize(9);doc.text("DATE : "+fmtD(s.date)+"      REF : "+s.ref,14,28);
  const body=all.map((r,k)=>[k+1,r.mat||"",r.tc||"",r.desc||"",r.i||"",r.o||""]);body.push(["","","","TOTAL WEIGHT",i||"",o||""],["","","","DIFFERENCE WEIGHT",+(o-i).toFixed(3),""]);
  doc.autoTable({startY:31,theme:"grid",head:[["NO","MATERIAL","BARCODE","DESCRIPTION","QTY IN (KG)","QTY OUT (KG)"]],body,styles:{font:"times",fontSize:9,textColor:20,lineColor:20,lineWidth:.2,minCellHeight:7},headStyles:{fillColor:255,textColor:20,fontStyle:"bold"},columnStyles:{0:{cellWidth:10},4:{cellWidth:24},5:{cellWidth:24}}});
  let y=doc.lastAutoTable.finalY+10;if(y>235){doc.addPage();y=20}
  const sg=(x,yy,l,n)=>{doc.setFont("times","normal");doc.setFontSize(8);doc.text(l,x,yy);doc.line(x,yy+8,x+75,yy+8);if(n!=null)doc.text("NAME : "+n,x,yy+12)};
  sg(14,y,"PREPARED BY :",s.prep||"");sg(14,y+18,"CHECK BY :",s.chk||"");sg(14,y+36,"VERIFY BY :",s.ver||"");
  sg(110,y,"TRANSFORMATION DOC. : "+(s.trans||""),null);sg(110,y+18,"GOODS ISSUE SLIP NO : "+(s.gi||""),null);sg(110,y+36,"KEY IN BY :",s.keyin||"");
  saveFile("ProductionSheet-"+s.ref+".pdf",doc.output("blob"));
}
const db=L;
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,x=b.dataset.v,two=t=>{if(b.dataset.c)return true;b.dataset.c=1;b.textContent=t;return false};
  if(a==="sadd"||a==="supd"){const d=collect(),er=check(d);if(er)return toast(er);delete d.badpost;
    if(a==="sadd"){const id=Date.now()+"-"+Math.floor(Math.random()*1000),ref="PS-"+Date.now().toString(36).toUpperCase().slice(-6);await db.collection("sheets").doc(id).set({...d,ref,outlet:OUT,created:Date.now(),status:"pending",trans:"",gi:""});if(d.kind==="fv")await learn([...d.src,...d.tgt]);try{localStorage.setItem("ps-last",JSON.stringify({plant:d.plant,sloc:d.sloc}))}catch(x){}if(d.kind==="ayam"){try{localStorage.setItem("ps-ayam",JSON.stringify([...d.src,...d.tgt].map(r=>({desc:r.desc,mat:r.mat,tc:r.tc}))))}catch(x){}}toast("Saved as "+ref);sub="pending";sv=id;se=false;location.hash="sheets";return}
    const tr=v("f-tr").trim();await db.collection("sheets").doc(sv).update({...d,trans:tr,gi:v("f-gi").trim(),keyin:v("f-ky").trim(),status:tr?"done":"pending",edited:Date.now()});if(d.kind==="fv")await learn([...d.src,...d.tgt]);toast("Sheet updated");se=false}
  else if(a==="scancel")se=false;
  else if(a==="clr"){const tr=b.closest("tr");if(tr.closest("#ab"))tr.querySelectorAll(".ai,.ao").forEach(i=>i.value="");else{tr.querySelectorAll("input").forEach(i=>i.value="");tr.querySelector(".ru").value="KG"}tot();return}
  else if(a==="addrow"){const ay=x==="a",tb=$(ay?"#ab":x==="s"?"#sb":"#tb");tb.insertAdjacentHTML("beforeend",ay?ayRow({},tb.rows.length):rowH(tb.rows.length+1,{}));return}
  else if(a==="sv"){sv=x;se=false}
  else if(a==="svback"){sv=null;se=false}
  else if(a==="sedit")se=true;
  else if(a==="sdel"){if(!two("Tap again to delete"))return;await db.collection("sheets").doc(x).delete();toast("Sheet deleted");sv=null}
  else if(a==="sdone"){const tr=v("c-tr").trim();if(!tr)return toast("Enter the transformation doc. number");await db.collection("sheets").doc(x).update({trans:tr,gi:v("c-gi").trim(),keyin:v("c-ky").trim(),status:"done"});toast("Marked completed")}
  else if(a==="nk")nk=x;
  else if(a==="sk")sk=x;
  else if(a==="aysave"){const o=ayc().map((r,i)=>({desc:v("yd"+i).trim()||r.desc,mat:v("ym"+i).trim(),tc:v("yt"+i).trim()}));try{localStorage.setItem("ps-ayam",JSON.stringify(o));toast("Ayam codes saved")}catch(e){toast("Could not save codes")}}
  else if(a==="sub")sub=x;
  else if(a==="ssearch")sq=v("sq");
  else if(a==="msearch")mq=v("mq");
  else if(a==="msave"){const mat=v("mm").trim(),tc=v("mt").trim(),desc=v("md").trim();if(!(mat||tc)||!desc)return toast("Enter a barcode or material, and a description");await db.collection("masterlist").doc(mkey(tc||mat)).set({mat,tc,desc,updated:Date.now()});ML=null;toast("Saved to masterlist")}
  else if(a==="medit")ML=M[x];
  else if(a==="mdel"){if(!two("Tap again to delete"))return;await db.collection("masterlist").doc(x).delete();toast("Item deleted")}
  else if(a==="cpy")return cpy(x,b.dataset.k,b.dataset.f);
  else if(a==="fcpy"){const d=collect();return cpy(null,b.dataset.k,b.dataset.f,d[b.dataset.k])}
  else if(a==="cpvx"){$("#cpv").classList.remove("on");return}
  else if(a==="fch"){const t=v(b.dataset.i).trim();if(!t)return toast("That field is empty");return copyText(t,"Copied — paste into SAP")}
  else if(a==="cph")return copyText(b.dataset.t,"Copied — paste into SAP");
  else if(a==="prn")return prn(x);
  else if(a==="dpdf")return dpdf(x);
  else if(a==="outlet")OUT="";
  else if(a==="osave"){const o=v(x).trim();if(!o)return toast("Enter the outlet name");OUT=o;try{localStorage.setItem("ps-outlet",o)}catch(e){}toast("Outlet saved")}
  render();
});
route();
db.collection("sheets").onSnapshot(r=>{SH=r;soft()});
db.collection("masterlist").onSnapshot(r=>{M={};r.forEach(d=>{M[d.id]=d});soft()});
</script>
