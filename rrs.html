<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RRS — Return Record System</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F2F0;--card:#FFFDFC;--ink:#2A1218;--mut:#7A6468;--line:#E8DCD8;--ac:#8C3347;--acfg:#fff;--head:#722F3E;--side:#3B1522;--gr:#2F6B3F;--grb:#E3F0E5;--bl:#35558F;--blb:#E4EBF7;--rd:#A33344;--rdb:#FBE4E4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A0E12;--card:#26151B;--ink:#F3E6E8;--mut:#B79DA3;--line:#3C2830;--ac:#E58AA0;--acfg:#1A0E12;--grb:#1F3A27;--gr:#8FD3A2;--blb:#1E2B47;--bl:#9DB8F0;--rdb:#47202A;--rd:#F2A0AC}}
:root[data-theme="dark"]{--bg:#1A0E12;--card:#26151B;--ink:#F3E6E8;--mut:#B79DA3;--line:#3C2830;--ac:#E58AA0;--acfg:#1A0E12;--grb:#1F3A27;--gr:#8FD3A2;--blb:#1E2B47;--bl:#9DB8F0;--rdb:#47202A;--rd:#F2A0AC}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Segoe UI",system-ui,sans-serif;line-height:1.5}
.app{display:flex;min-height:100vh}
aside{width:210px;background:var(--side);color:#F3DDE2;padding:18px 12px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px;margin:0 6px 20px;font-weight:800}
.brand i{font-style:normal;background:#5A2030;border:1px solid #8C4A5C;border-radius:10px;padding:6px 8px;font-size:.85rem}
.brand small{display:block;font-weight:600;font-size:.62rem;letter-spacing:.12em;opacity:.7}
nav a{display:block;color:inherit;text-decoration:none;padding:10px 12px;border-radius:10px;margin-bottom:4px;font-weight:600;font-size:.92rem}
nav a.on{background:#7A3446;color:#fff}nav a:hover{background:#4D1D2D}
.col{flex:1;min-width:0;padding:16px}
.top{background:var(--head);color:#fff;border-radius:12px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:1.35rem;font-weight:800}.top p{margin:2px 0 0;font-size:.68rem;letter-spacing:.1em;opacity:.85}
.pill-o{border:1px solid #fff9;border-radius:999px;padding:6px 14px;font-size:.78rem;font-weight:800;background:none;color:#fff;cursor:pointer;font-family:inherit}
main{max-width:1000px;margin:16px auto 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.hero h2{font-size:2rem;margin:4px 0;font-weight:800;letter-spacing:-.02em}.hero .k{color:var(--ac);font-weight:800;font-size:.72rem;letter-spacing:.1em}
.mut{color:var(--mut)}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stat{border-radius:16px;padding:20px;border:1px solid var(--line)}.stat.fresh{background:var(--grb)}.stat.goods{background:var(--blb)}.stat.warn{background:var(--rdb)}
.stat b.n{display:block;font-size:2.4rem;line-height:1.2;margin:8px 0}.stat a{color:var(--ink);font-weight:800;text-decoration:none}
.tag{font-size:.68rem;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.tag.fresh{background:var(--grb);color:var(--gr)}.tag.goods{background:var(--blb);color:var(--bl)}.tag.warn{background:var(--rdb);color:var(--rd)}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.78rem;color:var(--mut)}
ul.act{list-style:none;margin:0;padding:0}ul.act li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}ul.act small{width:100%;color:var(--mut)}
h3{margin:0 0 12px;font-size:1.1rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 8px 14px 0;background:var(--card);flex-wrap:wrap}
.seg button{border:0;background:none;padding:10px 16px;font:inherit;font-weight:700;color:var(--mut);cursor:pointer}.seg button.on{background:var(--ac);color:var(--acfg)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end}
label{display:block;font-size:.78rem;font-weight:700;color:var(--mut)}
input,select{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.btn{border:0;background:var(--ac);color:var(--acfg);padding:10px 18px;border-radius:10px;font:inherit;font-weight:800;cursor:pointer}
.btn.g{background:none;border:1px solid var(--line);color:var(--ink)}.btn.r{background:var(--rdb);color:var(--rd)}.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.sum{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.sum span{color:var(--mut)}.sum b{color:var(--ink)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
details.e{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}details.e summary{padding:12px 14px;cursor:pointer;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eb{padding:0 14px 14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:12px}.row label{flex:1 1 160px}
.empty{text-align:center;color:var(--mut);padding:24px}.hint{min-height:1.4em;font-size:.85rem;color:var(--mut);margin:8px 0 0}
#cpv{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));max-width:min(560px,calc(100vw - 32px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;z-index:25;box-shadow:0 6px 24px #0003;display:none}#cpv.on{display:block}#cpv pre{margin:6px 0 0;font-size:12px;overflow:auto;max-height:180px;white-space:pre}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}#modal.on{display:flex}#modal .card{max-width:420px;width:100%;margin:0}
#pdoc{display:none}
@page{size:A4;margin:8mm}
@media print{body>*:not(#pdoc){display:none!important}body{background:#fff!important}:root{padding:0!important}#pdoc{display:block;color:#111;background:#fff;font-family:Georgia,"Times New Roman",serif;font-size:11px;padding:6mm}#pdoc h2{text-align:center;margin:0;font-size:16px}#pdoc .ps{text-align:center;font-size:9px;font-weight:700;margin:2px 0 8px}#pdoc hr{border:0;border-top:1px solid #333;margin:8px 0}#pdoc .pg{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}#pdoc .pm{margin-bottom:6px}#pdoc small{display:block;font-size:8px;font-weight:700;color:#7a4a00;text-transform:uppercase}#pdoc table{width:100%;border:1px solid #333;margin-top:8px}#pdoc th,#pdoc td{border:1px solid #333;padding:4px 6px;text-align:left;font-size:10px}#pdoc .psg{display:flex;gap:30px;margin-top:70px;font-size:9px;font-weight:700}#pdoc .psg div{flex:1}#pdoc .psg i{display:block;border-top:1px solid #333;height:28px;margin-bottom:3px}}
@media (max-width:760px){.app{flex-direction:column}aside{width:100%;padding:10px}.brand{margin-bottom:8px}nav{display:flex;overflow-x:auto;gap:4px}nav a{white-space:nowrap;margin:0}.hero h2{font-size:1.5rem}}
</style>
</head>
<body>
<div class="app">
<aside><div class="brand"><i>RR</i><div>RRS<small>RETURN RECORDS</small></div></div><nav id="nav"></nav></aside>
<div class="col">
<header class="top"><div><h1>RRS — Return Record System</h1><p>SUPERMARKET GOODS RETURN · FOOD · NON-FOOD · DOCUMENT TRACKING</p></div><button class="pill-o" id="op" data-a="outlet"></button></header>
<main id="main"></main>
</div></div>
<div id="modal"><div class="card"><h3>Choose outlet</h3><p class="mut">Enter the outlet this device belongs to. This is only asked once per device.</p><label>Outlet<input id="ob" placeholder="e.g. 1007-SHPP"></label><div class="row"><button class="btn" data-a="outlet-save" data-v="ob">Continue</button></div></div></div>
<div id="pdoc" aria-hidden="true"></div>
<div id="cpv" role="status"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const TN={fresh:"Food",goods:"Non-Food"},REASONS=["Damaged","Expired","Near expiry","Wrong item","Overstock","Others"],UOMS=["PCS","PACK","CARTON","BOX","KG","BOTTLE","CAN","SET"];
const NAV=[["home","⌂  Home"],["new","＋  New Return"],["records","▤  Return Records"],["docs","❐  Documents"],["master","☰  Masterlist"],["admin","🔒  Admin"],["store","⚙  Store Settings"]];
let C={fresh:["101 MILK POWDER","102 CONFECTIONERY","103 RICE","104 COOKING OIL","105 CONDIMENTS / SEASONINGS","106 NOODLES / PORRIDGE / PASTA","107 CANNED & BOTTLED FOODS","108 BREAKFAST FOODS & SPREAD","109 BAKING NEEDS","110 BEVERAGES","111 ALCOHOLIC DRINKS","112 HEALTH FOOD / MEDICINE / FIRST AID","113 BAKERY","114 ORGANIC","115 DRIED FOOD","116 HOT FOOD","201 FROZEN / CHILL / DAIRY","202 MEAT & POULTRY","203 FRUITS","204 VEGETABLES","205 PREPACKED FOOD"],goods:["301 SANITARY & DIAPERS","302 BABY CARE","303 HAIR CARE","304 BODY CARE","305 FACIAL CARE & COSMETICS","306 DENTAL CARE","307 FABRIC & HOUSEHOLD","309 AIR FRESHENERS","310 PET FOOD","311 BATTERY / LIGHT SOURCE","312 TOBACCO / MAGAZINE & NEWSPAPER","401 HOUSEHOLD KITCHEN","402 HOUSEHOLD BATHROOM & LIVING ROOM","403 ELECTRICAL","404 HARDWARE","405 CAR ACCESSORIES","406 STATIONERY","407 SLIPPERS","408 SPORTS","409 TOYS","410 GIFT","411 FESTIVAL DECORATION ITEMS","412 FURNITURE","413 GARDENING","501 LINEN FURNISHING","502 LUGGAGE / TRAVEL ACCESSORIES","503 BACK TO SCHOOL","504 LADIES","505 GENTS","506 GENTS’ FOOTWEAR","507 BABY/ INFANT","508 BABY ACCESSORIES","509 CHILDREN"]};
const DEF=JSON.parse(JSON.stringify(C));
let OUT="";try{OUT=localStorage.getItem("rrs-outlet")||""}catch(e){}
let db=null,R=[],M={},isAdmin=false,loaded=false,err="";
let DE=null,de=false,dv=null,rf="",rto="",rty="",rst="",view="home",nt="fresh",D=null,rt="fresh",sub="pending",cf="",dq="",mt="fresh",mq="",ML=null;
const $=s=>document.querySelector(s),v=id=>($("#"+id)||{}).value||"";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>{const d=new Date(t),p=n=>String(n).padStart(2,"0");return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())};
const mk=(t,c)=>t+"_"+String(c).trim().replace(/[^A-Za-z0-9_-]/g,"_").slice(0,150);
const fm=(t,c)=>M[mk(t,c)]||Object.values(M).find(x=>x.type===t&&x.mat&&x.mat===String(c).trim());
const mine=()=>R.filter(e=>e.outlet===OUT);
const cnt=(t,s)=>mine().filter(e=>e.type===t&&e.status===s).length;
function unk(t){const m={};mine().filter(e=>e.type===t&&e.status==="pending").forEach(e=>e.items.forEach(i=>{if(!fm(t,i.code)){const o=m[i.code]=m[i.code]||{code:i.code,desc:i.desc,n:0};o.n++}}));return Object.values(m)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2400)}
async function W(f,ok){try{await f();if(ok)toast(ok);return true}catch(e){toast(e&&e.code==="permission_denied"?"You don’t have permission to do that":"Could not save: "+((e&&(e.code||e.message))||"error"));return false}}
const fld=(id,l,val="",ph="",type="text")=>`<label>${l}<input id="${id}" type="${type}" value="${esc(val)}" placeholder="${ph}" autocomplete="off"></label>`;
const sel=(id,l,opts,val="")=>`<label>${l}<select id="${id}"><option value="">Select…</option>${opts.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
const seg=(items,cur,a)=>`<div class="seg">${items.map(([k,l])=>`<button class="${cur===k?"on":""}" data-a="${a}" data-v="${k}">${l}</button>`).join("")}</div>`;
const TS=[["fresh","Food"],["goods","Non-Food"]];
function home(){
  const h=new Date().getHours(),g=h<12?"morning":h<18?"afternoon":"evening",rec=[...mine()].sort((a,b)=>b.created-a.created).slice(0,5),pr=unk("fresh").length+unk("goods").length;
  return `<section class="card hero"><span class="k">RRS · RETURN RECORD SYSTEM</span><h2>Good ${g}, welcome back.</h2><p class="mut">${new Date().toLocaleDateString("en-GB",{weekday:"long"})+", "+fmt(Date.now()).slice(0,10)} — your outlet return overview. Choose an action to get started.</p></section>
  <div class="grid"><div class="stat fresh"><b>Food Return</b> <span class="tag fresh">Pending</span><b class="n">${cnt("fresh","pending")}</b><span class="mut">Waiting for IT processing · </span><a href="#records" data-a="rec" data-v="fresh">View pending →</a></div>
  <div class="stat goods"><b>Non-Food Return</b> <span class="tag goods">Pending</span><b class="n">${cnt("goods","pending")}</b><span class="mut">Waiting for IT processing · </span><a href="#records" data-a="rec" data-v="goods">View pending →</a></div>
  <div class="stat warn"><b>Problem items</b><b class="n">${pr}</b><span class="mut">Codes missing from masterlist · </span><a href="#records" data-a="prob">Review →</a></div></div>
  <div class="grid" style="margin-top:16px"><div class="card"><h3>New Food Return</h3><p class="mut">Record food products being returned and submit the return document.</p><a class="btn" href="#new" data-a="nt" data-v="fresh" style="text-decoration:none;display:inline-block">Start food entry →</a></div>
  <div class="card"><h3>New Non-Food Return</h3><p class="mut">Record non-food items returned to the supplier and manage the related document.</p><a class="btn" href="#new" data-a="nt" data-v="goods" style="text-decoration:none;display:inline-block">Start non-food entry →</a></div>
  <div class="card"><h3>◷ Recent Activity</h3><ul class="act">${rec.length?rec.map(e=>`<li><span class="tag ${e.type}">${TN[e.type]}</span><b>${esc(e.cat)}</b><span class="pill">${e.items.length} item(s)</span><small>${fmt(e.created)} · ${esc(e.staff)}</small></li>`).join(""):`<li class="mut">${loaded?"No activity yet.":"Loading…"}</li>`}</ul></div></div>`;
}
function newv(){
  const t=D?D.type:nt,edit=!D||D.edit,d=D||{};
  let h=seg(TS.map(([k,l])=>[k,l+" Return"]),t,D?"x":"nt")+`<section class="card"><h3>1 &nbsp;Start New Entry</h3>`;
  h+=edit?`<div class="form">${fld("st","Receiving",d.staff)}${fld("sp","Supervisor",d.sup)}${fld("ck","Checked by",d.chk)}${fld("pt","Return to (supplier / vendor)",d.party)}${sel("ct","Category",C[t],d.cat)}<button class="btn" data-a="cont">Continue</button></div>`
  :`<div class="sum"><span>Receiving <b>${esc(d.staff)}</b></span><span>Supervisor <b>${esc(d.sup)}</b></span><span>Checked by <b>${esc(d.chk||"—")}</b></span><span>Supplier <b>${esc(d.party||"—")}</b></span><span>Category <b>${esc(d.cat)}</b></span><button class="btn g" data-a="edit">Edit</button><button class="btn r" data-a="cancel">Cancel</button></div>`;
  h+=`</section>`;
  if(D&&!edit)h+=`<section class="card"><h3>2 &nbsp;Scan &amp; Add Item</h3><div class="form">${fld("ic","Barcode / Material / PLU code")}<button class="btn g" data-a="look">Look up</button>${fld("imat","Material code (SAP)")}${fld("id","Description")}${fld("iq","Quantity","","0","number")}${sel("iu","UOM (pack / carton / pcs…)",UOMS)}${sel("ir","Reason",REASONS)}${fld("im","Remark")}<button class="btn" data-a="add">Insert</button></div><p class="hint" id="hint"></p></section>
  <section class="card"><h3>3 &nbsp;Preview (${D.items.length} items)</h3>${D.items.length?`<div class="tbl"><table><tr><th>#</th><th>Code</th><th>Material</th><th>Description</th><th>Qty</th><th>Reason</th><th>Remark</th><th></th></tr>${D.items.map((i,n)=>`<tr><td>${n+1}</td><td>${esc(i.code)}</td><td>${esc(i.mat||"—")}</td><td>${esc(i.desc||"—")}</td><td>${i.qty} ${esc(i.uom||"")}</td><td>${esc(i.reason)}</td><td>${esc(i.remark||"")}</td><td><button class="btn r" data-a="rm" data-v="${n}" aria-label="Remove item ${n+1}">✕</button></td></tr>`).join("")}</table></div>`:`<p class="empty">No items added yet.</p>`}<div class="row"><button class="btn" data-a="submit" ${D.items.length?"":"disabled"}>Submit all</button></div></section>`;
  return h;
}
function recs(){
  const mu=unk(rt);
  let h=seg(TS.map(([k,l])=>[k,l+" Return · "+cnt(k,"pending")]),rt,"rec")+seg([["pending","● Pending"],["done","✓ Completed"],["problem","⚠ Problem items · "+mu.length]],sub,"sub");
  if(sub==="problem")return h+`<section class="card"><h3>⚠ Problem items (${mu.length})</h3><p class="mut">Codes returned but not yet in the ${TN[rt]} masterlist. Saving one here adds it to the masterlist for every outlet.</p>${mu.length?mu.map((u,n)=>`<div class="row"><b style="flex:0 0 130px">${esc(u.code)}<br><small class="mut">${u.n} item(s)</small></b>${fld("pd"+n,"Description",u.desc)}${fld("pm"+n,"Material code")}${sel("pu"+n,"UOM",UOMS)}${sel("pc"+n,"Category",C[rt])}<button class="btn" data-a="fix" data-v="${n}">Save</button></div>`).join(""):`<p class="empty">No problem items right now.</p>`}</section>`;
  const list=mine().filter(e=>e.type===rt&&e.status===sub&&(!cf||e.cat===cf)).sort((a,b)=>b.created-a.created);
  return h+`<section class="card"><h3>${sub==="pending"?"● Pending":"✓ Completed"} ${TN[rt]} entries (${list.length})</h3><label style="max-width:260px">Category<select data-a="cf"><option value="">All categories</option>${C[rt].map(c=>`<option ${c===cf?"selected":""}>${esc(c)}</option>`).join("")}</select></label><div style="margin-top:14px">
  ${list.length?list.map(e=>`<details class="e"><summary><b>${e.ref}</b><span class="tag ${e.type}">${esc(e.cat)}</span><span class="pill">${e.items.length} item(s)</span><span class="mut">${esc(e.party||"No supplier")} · ${fmt(e.created)} · ${esc(e.staff)}</span></summary><div class="eb"><div class="tbl"><table><tr><th>Code</th><th>Material</th><th>Description</th><th>Qty</th><th>Reason</th><th>Remark</th></tr>${e.items.map(i=>`<tr><td>${esc(i.code)}${fm(e.type,i.code)?"":` <span class="tag warn">No masterlist</span>`}</td><td>${esc(i.mat||"—")}</td><td>${esc(i.desc||"—")}</td><td>${i.qty} ${esc(i.uom||"")}</td><td>${esc(i.reason)}</td><td>${esc(i.remark||"")}</td></tr>`).join("")}</table></div><div class="row" style="margin:0 0 10px"><button class="btn g" data-a="prn" data-v="${e.id}">🖨 Print</button><button class="btn g" data-a="dpdf" data-v="${e.id}">⬇ PDF</button><button class="btn g" data-a="dedit" data-v="${e.id}">✎ Edit</button><button class="btn g" data-a="cpy" data-v="${e.id}" data-f="all">📋 Material + Qty</button><button class="btn g" data-a="cpy" data-v="${e.id}" data-f="mat">Material only</button><button class="btn g" data-a="cpy" data-v="${e.id}" data-f="qty">Qty only</button></div><p class="mut">Supervisor: ${esc(e.sup)}${e.doc?` · Material document: <b>${esc(e.doc)}</b>`:""}</p>
  ${e.status==="pending"?`<div class="row">${fld("kb"+e.id,"Key in by")}${fld("md"+e.id,"Material document no.")}<button class="btn" data-a="done" data-v="${e.id}">Mark completed</button>${isAdmin?`<button class="btn r" data-a="del" data-v="${e.id}">Delete</button>`:""}</div>`:""}</div></details>`).join(""):`<p class="empty">${loaded?`No ${sub} entries in this category.`:"Loading shared data…"}</p>`}</div></section>`;
}
function docs(){
  if(dv){const e=R.find(x=>x.id==dv);if(e)return docview(e);dv=null}
  const q=dq.trim().toLowerCase(),all=[...mine()].sort((a,b)=>b.created-a.created),hit=q?all.filter(e=>(e.ref+" "+(e.doc||"")+" "+(e.party||"")+" "+e.cat).toLowerCase().includes(q)):all;

    if(!db)return toast("Shared database unavailable");const t=mt,txt=v("imp");if(!txt.trim())return toast("Paste the rows from Excel first");
    const arr=[];let skip=0;
    txt.split(/\r?\n/).forEach((ln,k)=>{if(!ln.trim())return;const c=(ln.includes("\t")?ln.split("\t"):ln.split(/[,;]/)).map(z=>z.trim().replace(/^"|"$/g,""));
      if(k===0&&/material|barcode|ean|desc/i.test(c.join(" "))&&!/^\d/.test(c[0]))return;
      let[mat,tc,desc,uom,g]=c;mat=(mat||"").replace(/^0{3,}(?=\d)/,"");tc=tc||"";desc=desc||"";if(!desc||!(mat||tc)){skip++;return}
      const cat=g?(C[t].find(z=>z===g||z.split(" ")[0]===g.split(" ")[0])||""):"",code=tc||mat;
      arr.push([mk(t,code),{type:t,code,mat,desc,uom:(uom||"").toUpperCase(),cat,updated:Date.now()}])});
    if(!arr.length)return toast("No valid rows found — check the column order");

  else if(a==="dedit"){const e=R.find(i=>i.id==x);if(!e)return;DE=JSON.parse(JSON.stringify(e));de=true;dv=x;if(view!=="docs"){location.hash="docs";return}}

  else if(a==="search")dq=v("dq");

const localDB=(()=>{const K="rrs-localdb";let S={};try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
const subs=[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){throw{code:"storage_full"}}};
const fire=()=>subs.forEach(f=>f());
const cp=o=>JSON.parse(JSON.stringify(o));
const colSnap=n=>({docs:Object.entries(S[n]||{}).map(([id,d])=>({id,data:()=>cp(d)}))});
const docSnap=(n,i)=>{const d=(S[n]||{})[i];return{exists:!!d,id:i,data:()=>d?cp(d):undefined}};
const put=(n,i,d,merge)=>{S[n]=S[n]||{};S[n][i]=merge?{...(S[n][i]||{}),...d}:cp(d)};
const docRef=(n,i)=>({set:async d=>{put(n,i,d);save();fire()},update:async d=>{if(!(S[n]||{})[i])throw{code:"not_found"};put(n,i,d,true);save();fire()},delete:async()=>{if(S[n]){delete S[n][i];save();fire()}},onSnapshot:cb=>{const f=()=>cb(docSnap(n,i));subs.push(f);f()}});
const split=p=>{const k=p.indexOf("/");return[p.slice(0,k),p.slice(k+1)]};
try{window.addEventListener("storage",e=>{if(e.key===K){try{S=JSON.parse(e.newValue||"{}")}catch(x){}fire()}})}catch(e){}
return{collection:n=>({doc:i=>docRef(n,i),add:async d=>{const i="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);put(n,i,d);save();fire();return docRef(n,i)},setMany:async arr=>{arr.forEach(([i,d])=>put(n,i,d));save();fire()},onSnapshot:(cb,er)=>{const f=()=>cb(colSnap(n));subs.push(f);f()}}),doc:p=>{const[n,i]=split(p);return docRef(n,i)}}})();
(async()=>{
  const u={canEdit:async()=>true},t=setTimeout(()=>{if(!loaded){err="Can’t reach the shared data yet — what you see may be out of date.";render()}},10000);
  db=localDB;
  if(!db){clearTimeout(t);err="Shared database unavailable. Open this page from its claude.ai link while signed in.";render();return}

  db.collection("returns").onSnapshot(s=>{R=s.docs.map(d=>({...d.data(),id:d.id}));loaded=true;err="";clearTimeout(t);soft()},e=>{err="Could not load returns ("+e.code+")";render()});
  db.collection("masterlist").onSnapshot(s=>{M={};s.docs.forEach(d=>{M[d.id]=d.data()});soft()},e=>{});
  db.doc("config/cats").onSnapshot(s=>{if(s.exists)C={...C,...s.data()};soft()},e=>{});
  render();
})();
